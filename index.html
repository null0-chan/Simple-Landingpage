<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
    <style>
        /* Import font */
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        /* General */
        * {
            margin: 0;
            padding: 0;
            font-family: "Baloo Bhaijaan 2", sans-serif;
            box-sizing: border-box;
        }

        /* Container */
        .container {
            width: 100vw;
            height: 100vh;
            background-image: url('image/background.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            padding: 0 6%;
            position: relative;
        }

        /* Content web */
        .content {
            top: 60%;
            position: absolute;
            transform: translateY(-50%);
            color: #fff;
        }
        .content p {
            margin-bottom: -15px;
        }
        .content h1 {
            font-size: 37px;
            font-weight: 6000;
            margin-bottom: -20px;
        }
        .content h1 span {
            color: #ff3751;
        }
        .content button {
            background: transparent;
            border: 2px solid #fff;
            outline: none;
            padding: 1px 7px;
            color: #fff;
            align-items: ccenter
            margin-top: 30px;
            cursor: pointer;
        }
        .content button i {
            font-size: 14px;
            margin-left: 5px;
            vertical-align: middle;
        }

        /* Launching-time */
        .launching-time {
            display: flex;
            gap: 25px;
        }
        .launching-time div {
            flex-basis: 80px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .launching-time div p {
            font-size: 50px;
            margin-bottom: 0px;
            line-height: 1;
            margin-top: 15px;
        }
        .launching-time div span {
            font-size: 15px;
            margin-top: -2px;
            display: block;
            align-items: center;
        }

        /* rocket animation */
        .rocket {
            width: 180px;
            position: absolute;
            right: 27%;
            bottom: 52%;
            animation: rocket 6s ease-in-out infinite;
        }

        @keyframes rocket {
            0% {
                bottom: 52%;
                opacity: 1;
            }
            70% {
                bottom: 120vh;
                /* naik sampai keluar layar */
                opacity: 0;
            }
            71% {
                bottom: 52%;
                opacity: 0;
            }
            100% {
                bottom: 52%;
                /* balik lagi ke posisi awal */
                opacity: 1;
                /* muncul lagi smooth */
            }
        }
    </style>
    <title>Maintenance Web</title>
</head>
<body>
    <div class="container">
    <!-- Rocket animation -->
    <img class="rocket" src="image/rocket.png" alt="rocket" />

<div class="content">
    <p>
        Web Is Under Maintenance
    </p>
    <h1>We're <span>Launching</span> Soon</h1>
    <div class="launching-time">
        <div>
            <p id="days">
                00
            </p>
            <span>Days</span>
        </div>
        <div>
            <p id="hours">
                00
            </p>
            <span>Hours</span>
        </div>
        <div>
            <p id="minutes">
                00
            </p>
            <span>Minutes</span>
        </div>
        <div>
            <p id="seconds">
                00
            </p>
            <span>Seconds</span>
        </div>
    </div>
    <button type="button">Learn More<i class="fa-solid fa-play"></i></button>
</div>
</div>
<script>
    /* ubah new Date("string") untuk kapan maintenance */
var countDownDate = new Date("oct 30, 2025 00:00:00").getTime();
var x = setInterval(function(){
var now = new Date().getTime();
var distance = countDownDate - now;

var days = Math.floor(distance / (1000 * 60 * 60 * 24));
var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
var seconds = Math.floor((distance % (1000 * 60)) / 1000);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

if(distance < 0){
    clearInterval(x);
    document.getElementById("days").innerHTML = 00;
    document.getElementById("hours").innerHTML = 00;
    document.getElementById("minutes").innerHTML = 00;
    document.getElementById("seconds").innerHTML = 00;
}
}, 1000);
</script>
</body>
</html>
